fullnameOverride: discord-ai-agent-postgres

image:
  repository: paradedb/paradedb
  tag: 0.23.0-pg16
  pullPolicy: IfNotPresent

workload:
  # Production supplies its existing bound claim during the Helm upgrade.
  existingClaim: existing-postgres-pvc

credentials:
  existingSecretName: discord-ai-agent-postgres
  passwordKey: POSTGRES_PASSWORD
  database: ai_v2
  username: tempo

resources:
  requests:
    cpu: 250m
    memory: 1Gi
  limits:
    cpu: "1"
    memory: 3Gi

sharedMemorySize: 1Gi
