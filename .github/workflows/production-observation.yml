name: Production Observation

on:
  schedule:
    - cron: "*/15 * * * *"
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  console-health:
    concurrency:
      group: production-console-health
      cancel-in-progress: false
    if: vars.AWS_REGION != '' && vars.EKS_CLUSTER_NAME != ''
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      EKS_CLUSTER_NAME: ${{ vars.EKS_CLUSTER_NAME }}
      HELM_RELEASE: ${{ vars.HELM_RELEASE || 'discord-ai-agent' }}
      K8S_NAMESPACE: ${{ vars.K8S_NAMESPACE || 'discord-ai-agent' }}
      CONSOLE_TUNNEL_ENABLED: ${{ vars.CONSOLE_TUNNEL_ENABLED }}
    steps:
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Verify Console boundary and production projection
        run: |
          aws eks update-kubeconfig --region "$AWS_REGION" --name "$EKS_CLUSTER_NAME"
          revision="$(kubectl --namespace "$K8S_NAMESPACE" get deployment "$HELM_RELEASE-console" -o jsonpath='{.spec.template.spec.containers[0].env[?(@.name=="APP_REVISION")].value}')"
          run_key="github-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          kubectl --namespace "$K8S_NAMESPACE" exec "deployment/$HELM_RELEASE-worker" -- \
            node dist/scripts/recordConsoleHealth.js --revision "$revision" --run-key "$run_key" --status started
          args=(--revision "$revision" --internal-url http://127.0.0.1:8081)
          if [ "${CONSOLE_TUNNEL_ENABLED:-}" = "true" ]; then
            args+=(--public-url https://console.mindcool.dev)
          fi
          set +e
          kubectl --namespace "$K8S_NAMESPACE" exec "deployment/$HELM_RELEASE-console" -- \
            node dist/scripts/consoleHealth.js "${args[@]}" > console-health.json
          health_status="$?"
          set -e
          if [ "$health_status" -eq 0 ]; then
            producer_status=succeeded
            outcome_code=healthy
          else
            producer_status=failed
            outcome_code=check_failed
            if [ ! -s console-health.json ]; then
              jq -n --arg revision "$revision" '{status:"unhealthy",revision:$revision,checks:[],activity:{sampled:false,detailSampled:false}}' > console-health.json
            fi
          fi
          kubectl --namespace "$K8S_NAMESPACE" exec "deployment/$HELM_RELEASE-worker" -- \
            node dist/scripts/recordConsoleHealth.js --revision "$revision" --run-key "$run_key" \
            --status "$producer_status" --outcome-code "$outcome_code"
          jq '{status, checkedAt, revision, checks, activity}' console-health.json >> "$GITHUB_STEP_SUMMARY"
          exit "$health_status"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: console-health
          path: console-health.json
          if-no-files-found: error
          retention-days: 14

  improvement-watchdog:
    # Do not let the slower six-hour observation job delay the watchdog past
    # its liveness budget. Watchdog runs are idempotent by GitHub run key.
    concurrency:
      group: improvement-watchdog
      cancel-in-progress: false
    if: vars.AWS_REGION != '' && vars.EKS_CLUSTER_NAME != ''
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      EKS_CLUSTER_NAME: ${{ vars.EKS_CLUSTER_NAME }}
      HELM_RELEASE: ${{ vars.HELM_RELEASE || 'discord-ai-agent' }}
      K8S_NAMESPACE: ${{ vars.K8S_NAMESPACE || 'discord-ai-agent' }}
    steps:
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Check improvement reconciler liveness
        run: |
          aws eks update-kubeconfig --region "$AWS_REGION" --name "$EKS_CLUSTER_NAME"
          revision="$(kubectl --namespace "$K8S_NAMESPACE" get deployment "$HELM_RELEASE-worker" -o jsonpath='{.spec.template.spec.containers[0].env[?(@.name=="APP_REVISION")].value}')"
          if ! kubectl --namespace "$K8S_NAMESPACE" exec "deployment/$HELM_RELEASE-worker" -- test -f dist/scripts/improvementWatchdog.js; then
            jq -n --arg revision "$revision" '{revision: $revision, status: "not_deployed", producers: [], detections: []}' > improvement-watchdog.json
            jq '{revision, status, producers, detections}' improvement-watchdog.json >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          set +e
          kubectl --namespace "$K8S_NAMESPACE" exec "deployment/$HELM_RELEASE-worker" -- \
            env GITHUB_RUN_ID="$GITHUB_RUN_ID" GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" \
            node dist/scripts/improvementWatchdog.js --revision "$revision" --record-detection --enforce > improvement-watchdog.json
          watchdog_status="$?"
          set -e
          jq '{revision, generatedAt, producers, detections}' improvement-watchdog.json >> "$GITHUB_STEP_SUMMARY"
          exit "$watchdog_status"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: improvement-watchdog
          path: improvement-watchdog.json
          if-no-files-found: error
          retention-days: 14

  revision-quality:
    concurrency:
      group: production-revision-quality
      cancel-in-progress: false
    if: >-
      vars.AWS_REGION != '' && vars.EKS_CLUSTER_NAME != '' &&
      (github.event_name == 'workflow_dispatch' || github.event.schedule == '17 */6 * * *')
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      EKS_CLUSTER_NAME: ${{ vars.EKS_CLUSTER_NAME }}
      HELM_RELEASE: ${{ vars.HELM_RELEASE || 'discord-ai-agent' }}
      K8S_NAMESPACE: ${{ vars.K8S_NAMESPACE || 'discord-ai-agent' }}
    steps:
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Collect safe revision aggregates
        run: |
          aws eks update-kubeconfig --region "$AWS_REGION" --name "$EKS_CLUSTER_NAME"
          revision="$(kubectl --namespace "$K8S_NAMESPACE" get deployment "$HELM_RELEASE-bot" -o jsonpath='{.spec.template.spec.containers[0].env[?(@.name=="APP_REVISION")].value}')"
          set +e
          kubectl --namespace "$K8S_NAMESPACE" exec "deployment/$HELM_RELEASE-worker" -- \
            node dist/scripts/revisionQuality.js --revision "$revision" --hours 48 --compare --enforce --record-detection > revision-quality.json
          quality_status="$?"
          set -e
          jq '{revision, windowHours, generatedAt, assessment, scheduleHealth, baseline: (.baseline | if . then {revision, assessment} else null end), answers, tools, signals, deliveries, improvements, detection, verification, failureClusters}' revision-quality.json >> "$GITHUB_STEP_SUMMARY"
          exit "$quality_status"
      - name: Collect safe improvement effectiveness
        if: always()
        run: |
          kubectl --namespace "$K8S_NAMESPACE" exec "deployment/$HELM_RELEASE-worker" -- \
            node dist/scripts/improve.js --target production --confirm-production health --hours 720 > improvement-effectiveness.json
          jq '{generatedAt, window, current, flow, automation, recurrence, economics, attention}' improvement-effectiveness.json >> "$GITHUB_STEP_SUMMARY"
          if [ "$(jq -r '.attention.status' improvement-effectiveness.json)" = "needs_attention" ]; then
            echo "::warning::Improvement effectiveness crossed an attention threshold; inspect the aggregate blocker, stalled, retry-exhaustion, and recurrence counts."
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: production-revision-quality
          path: |
            revision-quality.json
            improvement-effectiveness.json
          if-no-files-found: error
          retention-days: 14
