[package]
name = "discord-agent-nanocodex-runtime"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false

[dependencies]
async-trait = "0.1.89"
libc = "0.2"
nanocode = { git = "https://github.com/gakonst/nanocodex.git", rev = "59b663bad2f80bfb6dc52648dffa3d08b9cf2b34", default-features = false, features = ["local-cells"] }
nanocode-backend-codex = { git = "https://github.com/gakonst/nanocodex.git", rev = "59b663bad2f80bfb6dc52648dffa3d08b9cf2b34" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["io-std", "io-util", "macros", "rt-multi-thread", "sync", "time"] }

# Mirror nanocode's own [patch.crates-io] so this runtime builds the same
# crates nanocode does. Keep the rev equal to the nanocode rev above.
[patch.crates-io]
iana-time-zone = { git = "https://github.com/gakonst/nanocodex.git", rev = "59b663bad2f80bfb6dc52648dffa3d08b9cf2b34" }
rustls-platform-verifier = { git = "https://github.com/gakonst/nanocodex.git", rev = "59b663bad2f80bfb6dc52648dffa3d08b9cf2b34" }

[profile.release]
codegen-units = 1
lto = "thin"
strip = true
