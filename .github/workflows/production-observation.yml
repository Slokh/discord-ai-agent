name: Production Observation

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  console-health:
    concurrency:
      group: production-console-health
      cancel-in-progress: false
    if: vars.AWS_REGION != '' && vars.CONSOLE_TLS_CERTIFICATE_ARN != ''
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      HELM_RELEASE: ${{ vars.HELM_RELEASE || 'discord-ai-agent' }}
      K8S_NAMESPACE: ${{ vars.K8S_NAMESPACE || 'discord-ai-agent' }}
      CONSOLE_TLS_CERTIFICATE_ARN: ${{ vars.CONSOLE_TLS_CERTIFICATE_ARN }}
    steps:
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: actions/checkout@v7
      - name: Verify Console boundary and production projection
        run: |
          command="revision=\$(k3s kubectl --namespace '$K8S_NAMESPACE' get deployment '$HELM_RELEASE-console' -o jsonpath='{.spec.template.spec.containers[0].env[?(@.name==\"APP_REVISION\")].value}')"
          command+="; k3s kubectl --namespace '$K8S_NAMESPACE' exec 'deployment/$HELM_RELEASE-console' -- node dist/scripts/consoleHealth.js --revision \"\$revision\" --internal-url http://127.0.0.1:8081 --public-url https://console.mindcool.dev"
          scripts/runProductionCommand.sh "$command" > console-health.json
          jq '{status, checkedAt, revision, checks, activity}' console-health.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: console-health
          path: console-health.json
          if-no-files-found: error
          retention-days: 14

