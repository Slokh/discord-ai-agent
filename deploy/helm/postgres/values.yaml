fullnameOverride: discord-ai-agent-postgres

image:
  repository: paradedb/paradedb
  tag: 0.23.0-pg16
  pullPolicy: IfNotPresent

workload:
  # Bridge mode creates stable DNS for the existing database without mounting
  # its volume. Enable only after the previous StatefulSet has stopped.
  enabled: false
  existingClaim: existing-postgres-pvc

bridgeSelector:
  app.kubernetes.io/name: centaur
  app.kubernetes.io/instance: previous-runtime
  app.kubernetes.io/component: postgres

credentials:
  existingSecretName: discord-ai-agent-postgres
  passwordKey: POSTGRES_PASSWORD
  database: ai_v2
  username: tempo

resources:
  requests:
    cpu: 250m
    memory: 1Gi
  limits:
    cpu: "1"
    memory: 3Gi

sharedMemorySize: 1Gi
