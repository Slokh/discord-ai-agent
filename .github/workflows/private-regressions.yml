name: Private Production Regressions

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: private-production-regressions
  cancel-in-progress: false

jobs:
  evaluate:
    if: vars.AWS_REGION != ''
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      K8S_NAMESPACE: ${{ vars.K8S_NAMESPACE || 'discord-ai-agent' }}
      HELM_RELEASE: ${{ vars.HELM_RELEASE || 'discord-ai-agent' }}
    steps:
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: actions/checkout@v7
      - name: Export and run private regressions
        run: |
          command="revision=\$(k3s kubectl --namespace '$K8S_NAMESPACE' get deployment '$HELM_RELEASE-bot' -o jsonpath='{.spec.template.spec.containers[0].env[?(@.name==\"APP_REVISION\")].value}')"
          command+="; set +e; k3s kubectl --namespace '$K8S_NAMESPACE' exec 'deployment/$HELM_RELEASE-worker' -- node dist/scripts/exportImprovementEvals.js; status=\$?"
          command+="; if [ \$status -eq 0 ]; then k3s kubectl --namespace '$K8S_NAMESPACE' exec 'deployment/$HELM_RELEASE-worker' -- node dist/scripts/eval.js --private-only --safe-summary --record-improvement-results; status=\$?; fi"
          command+="; if [ \$status -ne 0 ]; then k3s kubectl --namespace '$K8S_NAMESPACE' exec 'deployment/$HELM_RELEASE-worker' -- node dist/scripts/improve.js --target production --confirm-production detect --source eval_detection --source-id 'private-regressions:$GITHUB_RUN_ID' --stable-code private-regression-suite --summary \"Private regression workflow failed for deployed revision \$revision.\" --classification defect --severity high --domain evals --scope deployment --revision \"\$revision\" || true; fi"
          command+="; exit \$status"
          scripts/runProductionCommand.sh "$command"
