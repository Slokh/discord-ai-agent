name: Deploy EKS

on:
  workflow_call:
    inputs:
      image_tag:
        description: Immutable application and sandbox image tag to deploy
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-eks-production
  cancel-in-progress: false

jobs:
  deploy-eks:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      EKS_CLUSTER_NAME: ${{ vars.EKS_CLUSTER_NAME }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
      HELM_RELEASE: ${{ vars.HELM_RELEASE || 'discord-ai-agent' }}
      K8S_NAMESPACE: ${{ vars.K8S_NAMESPACE || 'discord-ai-agent' }}
      DISCORD_BOT_CHANNEL_ID: ${{ vars.DISCORD_BOT_CHANNEL_ID }}
      CONSOLE_TLS_CERTIFICATE_ARN: ${{ vars.CONSOLE_TLS_CERTIFICATE_ARN }}
      CONSOLE_ROUTE53_HOSTED_ZONE_ID: ${{ vars.CONSOLE_ROUTE53_HOSTED_ZONE_ID }}
      CONSOLE_PUBLIC_HOSTNAME: console.mindcool.dev
      IMAGE_TAG: ${{ inputs.image_tag }}
    steps:
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.image_tag }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: azure/setup-helm@v5
      - name: Deploy Helm chart
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          aws eks update-kubeconfig --region "$AWS_REGION" --name "$EKS_CLUSTER_NAME"
          previous_app_revision=""
          previous_helm_revision=""
          if helm status "$HELM_RELEASE" --namespace "$K8S_NAMESPACE" --output json > previous-release.json 2>/dev/null; then
            previous_helm_revision="$(jq -r '.version // empty' previous-release.json)"
          fi
          echo "PREVIOUS_HELM_REVISION=$previous_helm_revision" >> "$GITHUB_ENV"
          if kubectl --namespace "$K8S_NAMESPACE" get deployment "$HELM_RELEASE-bot" >/dev/null 2>&1; then
            previous_app_revision="$(kubectl --namespace "$K8S_NAMESPACE" get deployment "$HELM_RELEASE-bot" -o jsonpath='{.spec.template.spec.containers[?(@.name=="bot")].env[?(@.name=="APP_REVISION")].value}')"
          fi
          helm_args=(
            --namespace "$K8S_NAMESPACE"
            --create-namespace
            --set "image.repository=$REGISTRY/$ECR_REPOSITORY"
            --set "image.tag=$IMAGE_TAG"
            --set "sandbox.image=$REGISTRY/$ECR_REPOSITORY-sandbox:$IMAGE_TAG"
            --set-string "config.appRevision=$IMAGE_TAG"
            --set-string "config.releaseVerificationId=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          )
          if [ -n "$previous_app_revision" ]; then
            helm_args+=(--set-string "config.previousAppRevision=$previous_app_revision")
          fi
          if [ -n "${DISCORD_BOT_CHANNEL_ID:-}" ]; then
            helm_args+=(--set-string "config.botChannelId=$DISCORD_BOT_CHANNEL_ID")
          fi
          if [ -n "${CONSOLE_TLS_CERTIFICATE_ARN:-}" ]; then
            helm_args+=(
              --set "console.publicService.enabled=true"
              --set-string "console.publicService.annotations.service\\.beta\\.kubernetes\\.io/aws-load-balancer-type=nlb"
              --set-string "console.publicService.annotations.service\\.beta\\.kubernetes\\.io/aws-load-balancer-scheme=internet-facing"
              --set-string "console.publicService.annotations.service\\.beta\\.kubernetes\\.io/aws-load-balancer-ssl-cert=$CONSOLE_TLS_CERTIFICATE_ARN"
              --set-string "console.publicService.annotations.service\\.beta\\.kubernetes\\.io/aws-load-balancer-ssl-ports=https"
              --set-string "console.publicService.annotations.service\\.beta\\.kubernetes\\.io/aws-load-balancer-backend-protocol=http"
            )
          fi
          helm upgrade --install "$HELM_RELEASE" deploy/helm/discord-ai-agent \
            --rollback-on-failure \
            --force-conflicts \
            --wait \
            --timeout 10m \
            "${helm_args[@]}"
          if [ -n "${CONSOLE_TLS_CERTIFICATE_ARN:-}" ]; then
            if [ -z "${CONSOLE_ROUTE53_HOSTED_ZONE_ID:-}" ]; then
              echo "CONSOLE_ROUTE53_HOSTED_ZONE_ID is required when Console public TLS is enabled" >&2
              exit 1
            fi
            load_balancer_hostname=""
            for _ in $(seq 1 60); do
              load_balancer_hostname="$(kubectl --namespace "$K8S_NAMESPACE" get service "$HELM_RELEASE-console-public" -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')"
              if [ -n "$load_balancer_hostname" ]; then
                break
              fi
              sleep 5
            done
            if [ -z "$load_balancer_hostname" ]; then
              echo "Console load balancer did not publish a hostname" >&2
              exit 1
            fi
            load_balancer_zone_id=""
            for _ in $(seq 1 30); do
              load_balancer_zone_id="$(aws elbv2 describe-load-balancers \
                --query "LoadBalancers[?DNSName=='$load_balancer_hostname'].CanonicalHostedZoneId | [0]" \
                --output text)"
              if [ -n "$load_balancer_zone_id" ] && [ "$load_balancer_zone_id" != "None" ]; then
                break
              fi
              sleep 5
            done
            if [ -z "$load_balancer_zone_id" ] || [ "$load_balancer_zone_id" = "None" ]; then
              echo "Could not resolve the Console load balancer hosted zone" >&2
              exit 1
            fi
            change_batch="$(jq -nc \
              --arg name "$CONSOLE_PUBLIC_HOSTNAME" \
              --arg dnsName "$load_balancer_hostname" \
              --arg hostedZoneId "$load_balancer_zone_id" \
              '{Changes:[{Action:"UPSERT",ResourceRecordSet:{Name:$name,Type:"A",AliasTarget:{HostedZoneId:$hostedZoneId,DNSName:$dnsName,EvaluateTargetHealth:true}}}]}')"
            change_id="$(aws route53 change-resource-record-sets \
              --hosted-zone-id "$CONSOLE_ROUTE53_HOSTED_ZONE_ID" \
              --change-batch "$change_batch" \
              --query 'ChangeInfo.Id' \
              --output text)"
            aws route53 wait resource-record-sets-changed --id "$change_id"
          fi
      - name: Verify release and recover on failure
        run: |
          args=(
            --namespace "$K8S_NAMESPACE"
            --release "$HELM_RELEASE"
            --revision "$IMAGE_TAG"
            --deployment-id "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            --attempts 2
          )
          if [ -n "${PREVIOUS_HELM_REVISION:-}" ]; then
            args+=(--previous-helm-revision "$PREVIOUS_HELM_REVISION")
          fi
          if [ -n "${CONSOLE_TLS_CERTIFICATE_ARN:-}" ]; then
            args+=(--console-public-url "https://console.mindcool.dev")
          fi
          npx tsx scripts/postDeployVerification.ts "${args[@]}"
