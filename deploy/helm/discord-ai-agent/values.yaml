image:
  repository: ghcr.io/owner/discord-ai-agent
  tag: latest
  pullPolicy: IfNotPresent

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000

containerSecurityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]
  seccompProfile:
    type: RuntimeDefault

sandbox:
  image: ghcr.io/owner/discord-ai-agent-sandbox:latest
  imagePullPolicy: IfNotPresent
  serviceAccountName: discord-ai-agent-sandbox
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 2Gi
  taskTimeoutSeconds: 1800
  ttlSecondsAfterFinished: 3600

secret:
  existingSecretName: discord-ai-agent-env

config:
  # Deployed commit SHA included in runtime and model-call telemetry.
  appRevision: unknown
  # Unique workflow-run identifier; prevents a repeated SHA from reusing an older promotion.
  releaseVerificationId: ""
  # The deploy workflow fills this from the currently running bot before rollout.
  previousAppRevision: ""
  # Optional Discord channel for automatic plain-English deployment notes.
  releaseNotesChannelId: ""

api:
  replicas: 1
  port: 8080
  service:
    type: ClusterIP
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 500m, memory: 512Mi }

bot:
  replicas: 1
  terminationGracePeriodSeconds: 120
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: "1", memory: 1Gi }

worker:
  replicas: 1
  terminationGracePeriodSeconds: 120
  resources:
    requests: { cpu: 250m, memory: 512Mi }
    limits: { cpu: "2", memory: 2Gi }

migrations:
  enabled: true

networkPolicy:
  enabled: true
  allowSandboxInternetEgress: true

ciliumFqdnPolicy:
  enabled: false
  allowedHosts:
    - github.com
    - api.github.com
    - codeload.github.com
    - objects.githubusercontent.com
    - openrouter.ai
    - registry.npmjs.org
