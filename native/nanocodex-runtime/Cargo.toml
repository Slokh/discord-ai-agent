[package]
name = "discord-agent-nanocodex-runtime"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false

[dependencies]
async-trait = "0.1.89"
nanocodex = { git = "https://github.com/Slokh/nanocodex.git", rev = "f630f89a468de9658c864e8cf869dbbc74babaf5" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.18"
tokio = { version = "1.49.0", features = ["io-std", "io-util", "macros", "rt-multi-thread", "sync"] }

[profile.release]
codegen-units = 1
lto = "thin"
strip = true

# NanoCodex uses a maintainer-pinned reqwest revision for its ring-backed
# rustls feature. Cargo does not inherit a Git dependency's workspace patch,
# so direct consumers must repeat the exact pin.
[patch.crates-io]
reqwest = { git = "https://github.com/gakonst/reqwest", rev = "d45d0c3d2b2a74b723f82791f464d6241f2c6e90" }
