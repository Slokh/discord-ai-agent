name: Deploy EKS

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-eks-production
  cancel-in-progress: false

jobs:
  deploy-eks:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && vars.AWS_REGION != '' && vars.EKS_CLUSTER_NAME != '' && vars.ECR_REPOSITORY != ''
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      EKS_CLUSTER_NAME: ${{ vars.EKS_CLUSTER_NAME }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
      HELM_RELEASE: ${{ vars.HELM_RELEASE || 'discord-ai-agent' }}
      K8S_NAMESPACE: ${{ vars.K8S_NAMESPACE || 'discord-ai-agent' }}
      API_SERVICE_TYPE: ${{ vars.API_SERVICE_TYPE }}
      API_TLS_CERTIFICATE_ARN: ${{ vars.API_TLS_CERTIFICATE_ARN }}
      CONTROL_UI_PUBLIC_URL: ${{ vars.CONTROL_UI_PUBLIC_URL }}
      RELEASE_NOTES_CHANNEL_ID: ${{ vars.RELEASE_NOTES_CHANNEL_ID }}
      IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - uses: azure/setup-helm@v5
      - name: Deploy Helm chart
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          aws eks update-kubeconfig --region "$AWS_REGION" --name "$EKS_CLUSTER_NAME"
          previous_app_revision=""
          if kubectl --namespace "$K8S_NAMESPACE" get deployment "$HELM_RELEASE-bot" >/dev/null 2>&1; then
            previous_app_revision="$(kubectl --namespace "$K8S_NAMESPACE" get deployment "$HELM_RELEASE-bot" -o jsonpath='{.spec.template.spec.containers[?(@.name=="bot")].env[?(@.name=="APP_REVISION")].value}')"
          fi
          helm_args=(
            --namespace "$K8S_NAMESPACE"
            --create-namespace
            --set "image.repository=$REGISTRY/$ECR_REPOSITORY"
            --set "image.tag=$IMAGE_TAG"
            --set "sandbox.image=$REGISTRY/$ECR_REPOSITORY-sandbox:$IMAGE_TAG"
            --set-string "config.appRevision=$IMAGE_TAG"
          )
          if [ -n "$previous_app_revision" ]; then
            helm_args+=(--set-string "config.previousAppRevision=$previous_app_revision")
          fi
          if [ -n "${RELEASE_NOTES_CHANNEL_ID:-}" ]; then
            helm_args+=(--set-string "config.releaseNotesChannelId=$RELEASE_NOTES_CHANNEL_ID")
          fi
          if [ -n "${API_SERVICE_TYPE:-}" ]; then
            helm_args+=(--set "api.publicService.type=$API_SERVICE_TYPE")
          fi
          if [ -n "${API_TLS_CERTIFICATE_ARN:-}" ]; then
            helm_args+=(
              --set "api.publicService.enabled=true"
              --set-string "api.publicService.annotations.service\\.beta\\.kubernetes\\.io/aws-load-balancer-ssl-cert=$API_TLS_CERTIFICATE_ARN"
              --set-string "api.publicService.annotations.service\\.beta\\.kubernetes\\.io/aws-load-balancer-ssl-ports=https"
              --set-string "api.publicService.annotations.service\\.beta\\.kubernetes\\.io/aws-load-balancer-backend-protocol=http"
            )
          fi
          if [ -n "${CONTROL_UI_PUBLIC_URL:-}" ]; then
            helm_args+=(--set-string "config.controlUiPublicUrl=$CONTROL_UI_PUBLIC_URL")
          fi
          helm upgrade --install "$HELM_RELEASE" deploy/helm/discord-ai-agent \
            --atomic \
            --wait \
            --timeout 10m \
            "${helm_args[@]}"
      - name: Verify deployed revision and capabilities
        run: |
          for component in api bot worker; do
            deployment="$HELM_RELEASE-$component"
            kubectl --namespace "$K8S_NAMESPACE" rollout status "deployment/$deployment" --timeout=2m
            image="$(kubectl --namespace "$K8S_NAMESPACE" get deployment "$deployment" -o jsonpath='{.spec.template.spec.containers[0].image}')"
            revision="$(kubectl --namespace "$K8S_NAMESPACE" get deployment "$deployment" -o jsonpath='{.spec.template.spec.containers[0].env[?(@.name=="APP_REVISION")].value}')"
            test "${image##*:}" = "$IMAGE_TAG"
            test "$revision" = "$IMAGE_TAG"
          done
          kubectl auth can-i create jobs.batch \
            --namespace "$K8S_NAMESPACE" \
            --as="system:serviceaccount:$K8S_NAMESPACE:$HELM_RELEASE-worker" | grep -qx yes
          timeout 8m kubectl --namespace "$K8S_NAMESPACE" exec "deployment/$HELM_RELEASE-worker" -- \
            node dist/scripts/postDeployCanary.js
      - name: Run private production regressions
        run: |
          kubectl --namespace "$K8S_NAMESPACE" exec "deployment/$HELM_RELEASE-worker" -- \
            node dist/scripts/exportRunFeedbackEvals.js
          kubectl --namespace "$K8S_NAMESPACE" exec "deployment/$HELM_RELEASE-worker" -- \
            node dist/scripts/eval.js --private-only --safe-summary
          for component in api bot worker; do
            deployment="$HELM_RELEASE-$component"
            desired="$(kubectl --namespace "$K8S_NAMESPACE" get deployment "$deployment" -o jsonpath='{.spec.replicas}')"
            ready="$(kubectl --namespace "$K8S_NAMESPACE" get deployment "$deployment" -o jsonpath='{.status.readyReplicas}')"
            updated="$(kubectl --namespace "$K8S_NAMESPACE" get deployment "$deployment" -o jsonpath='{.status.updatedReplicas}')"
            test "$ready" = "$desired"
            test "$updated" = "$desired"
          done
