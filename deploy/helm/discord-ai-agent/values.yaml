image:
  repository: ghcr.io/owner/discord-ai-agent
  tag: latest
  pullPolicy: IfNotPresent

imagePullSecrets:
  - name: discord-ai-agent-ecr

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000

containerSecurityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]
  seccompProfile:
    type: RuntimeDefault

sandbox:
  image: ghcr.io/owner/discord-ai-agent-sandbox:latest
  imagePullPolicy: IfNotPresent
  serviceAccountName: discord-ai-agent-sandbox
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 2Gi
  taskTimeoutSeconds: 1800
  ttlSecondsAfterFinished: 3600

secret:
  existingSecretName: discord-ai-agent-env

config:
  # Deployed commit SHA included in runtime and model-call telemetry.
  appRevision: unknown
  # Unique workflow-run identifier; prevents a repeated SHA from reusing an older promotion.
  releaseVerificationId: ""
  # The deploy workflow fills this from the currently running bot before rollout.
  previousAppRevision: ""
  # Single Discord text channel for bot updates and improvement threads.
  botChannelId: ""

api:
  enabled: false
  replicas: 1
  port: 8080
  service:
    type: ClusterIP
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 500m, memory: 512Mi }

console:
  enabled: false
  replicas: 1
  port: 8081
  service:
    type: ClusterIP
  publicService:
    enabled: false
    type: LoadBalancer
    annotations: {}
    port: 443
  resources:
    requests: { cpu: 50m, memory: 96Mi }
    limits: { cpu: 250m, memory: 256Mi }

bot:
  replicas: 1
  terminationGracePeriodSeconds: 120
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: "1", memory: 1Gi }

worker:
  replicas: 1
  terminationGracePeriodSeconds: 120
  resources:
    requests: { cpu: 250m, memory: 512Mi }
    limits: { cpu: "2", memory: 2Gi }

# The watchdog must run independently of the worker that owns reconciliation.
improvementWatchdog:
  enabled: false
  schedule: "*/15 * * * *"
  startingDeadlineSeconds: 600
  activeDeadlineSeconds: 300
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { cpu: 250m, memory: 256Mi }

migrations:
  enabled: true

networkPolicy:
  enabled: false
  allowSandboxInternetEgress: true

ciliumFqdnPolicy:
  enabled: false
  allowedHosts:
    - github.com
    - api.github.com
    - codeload.github.com
    - objects.githubusercontent.com
    - openrouter.ai
    - registry.npmjs.org
