apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "discord-ai-agent.fullname" . }}-app
  labels:
    {{- include "discord-ai-agent.labels" . | nindent 4 }}
automountServiceAccountToken: false
{{- with .Values.imagePullSecrets }}
imagePullSecrets:
  {{- toYaml . | nindent 2 }}
{{- end }}
