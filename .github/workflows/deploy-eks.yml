name: Deploy EKS

on:
  workflow_call:
    inputs:
      image_tag:
        description: Immutable runtime image tag to deploy
        required: true
        type: string
      bot_replicas:
        description: Discord Gateway replicas
        required: false
        default: 1
        type: number
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type prepare-cutover to deploy manually
        required: true
        type: string
      image_tag:
        description: Immutable runtime image tag to deploy
        required: true
        type: string
      bot_replicas:
        description: Use zero for readiness, then one only after the old Gateway is stopped
        required: true
        default: 0
        type: number

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-eks-production
  cancel-in-progress: false

jobs:
  deploy-eks:
    if: github.event_name != 'workflow_dispatch' || inputs.confirmation == 'prepare-cutover'
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      EKS_CLUSTER_NAME: ${{ vars.EKS_CLUSTER_NAME }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
      HELM_RELEASE: ${{ vars.HELM_RELEASE || 'discord-ai-agent' }}
      K8S_NAMESPACE: ${{ vars.K8S_NAMESPACE || 'discord-ai-agent' }}
      DISCORD_BOT_CHANNEL_ID: ${{ vars.DISCORD_BOT_CHANNEL_ID }}
      IMAGE_TAG: ${{ inputs.image_tag }}
      BOT_REPLICAS: ${{ inputs.bot_replicas }}
    steps:
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.image_tag }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: azure/setup-helm@v5
      - name: Deploy bot and worker
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          aws eks update-kubeconfig --region "$AWS_REGION" --name "$EKS_CLUSTER_NAME"
          previous_app_revision=""
          previous_helm_revision=""
          if helm status "$HELM_RELEASE" --namespace "$K8S_NAMESPACE" --output json > previous-release.json 2>/dev/null; then
            previous_helm_revision="$(jq -r '.version // empty' previous-release.json)"
          fi
          echo "PREVIOUS_HELM_REVISION=$previous_helm_revision" >> "$GITHUB_ENV"
          if kubectl --namespace "$K8S_NAMESPACE" get deployment "$HELM_RELEASE-bot" >/dev/null 2>&1; then
            previous_app_revision="$(kubectl --namespace "$K8S_NAMESPACE" get deployment "$HELM_RELEASE-bot" -o jsonpath='{.spec.template.spec.containers[?(@.name=="bot")].env[?(@.name=="APP_REVISION")].value}')"
          fi
          helm_args=(
            --namespace "$K8S_NAMESPACE"
            --create-namespace
            --set "image.repository=$REGISTRY/$ECR_REPOSITORY"
            --set "image.tag=$IMAGE_TAG"
            --set "bot.replicas=$BOT_REPLICAS"
            --set-string "config.appRevision=$IMAGE_TAG"
            --set-string "config.releaseVerificationId=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          )
          if [ -n "$previous_app_revision" ]; then
            helm_args+=(--set-string "config.previousAppRevision=$previous_app_revision")
          fi
          if [ -n "${DISCORD_BOT_CHANNEL_ID:-}" ]; then
            helm_args+=(--set-string "config.botChannelId=$DISCORD_BOT_CHANNEL_ID")
          fi
          helm upgrade --install "$HELM_RELEASE" deploy/helm/discord-ai-agent \
            --rollback-on-failure \
            --wait \
            --timeout 10m \
            "${helm_args[@]}"
      - name: Verify content-free readiness
        run: |
          kubectl --namespace "$K8S_NAMESPACE" rollout status "deployment/$HELM_RELEASE-worker" --timeout=2m
          if [ "$BOT_REPLICAS" = "0" ]; then
            actual="$(kubectl --namespace "$K8S_NAMESPACE" get deployment "$HELM_RELEASE-bot" -o jsonpath='{.spec.replicas}')"
            test "$actual" = "0"
            permission="$(kubectl auth can-i create jobs.batch --namespace "$K8S_NAMESPACE" --as="system:serviceaccount:$K8S_NAMESPACE:$HELM_RELEASE-app" || true)"
            test "$permission" = "no"
            exit 0
          fi
          args=(
            --namespace "$K8S_NAMESPACE"
            --release "$HELM_RELEASE"
            --revision "$IMAGE_TAG"
            --deployment-id "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            --attempts 2
          )
          if [ -n "${PREVIOUS_HELM_REVISION:-}" ]; then
            args+=(--previous-helm-revision "$PREVIOUS_HELM_REVISION")
          fi
          npx tsx scripts/postDeployVerification.ts "${args[@]}"
