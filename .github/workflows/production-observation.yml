name: Production Observation

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  console-health:
    concurrency:
      group: production-console-health
      cancel-in-progress: false
    if: vars.AWS_REGION != '' && vars.CONSOLE_TLS_CERTIFICATE_ARN != ''
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      HELM_RELEASE: ${{ vars.HELM_RELEASE || 'discord-ai-agent' }}
      K8S_NAMESPACE: ${{ vars.K8S_NAMESPACE || 'discord-ai-agent' }}
      CONSOLE_TLS_CERTIFICATE_ARN: ${{ vars.CONSOLE_TLS_CERTIFICATE_ARN }}
    steps:
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: actions/checkout@v7
      - name: Verify Console boundary and production projection
        run: |
          run_key="github-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          command="revision=\$(k3s kubectl --namespace '$K8S_NAMESPACE' get deployment '$HELM_RELEASE-console' -o jsonpath='{.spec.template.spec.containers[0].env[?(@.name==\"APP_REVISION\")].value}')"
          command+="; k3s kubectl --namespace '$K8S_NAMESPACE' exec 'deployment/$HELM_RELEASE-worker' -- node dist/scripts/recordConsoleHealth.js --revision \"\$revision\" --run-key '$run_key' --status started"
          command+="; k3s kubectl --namespace '$K8S_NAMESPACE' exec 'deployment/$HELM_RELEASE-console' -- node dist/scripts/consoleHealth.js --revision \"\$revision\" --internal-url http://127.0.0.1:8081 --public-url https://console.mindcool.dev"
          scripts/runProductionCommand.sh "$command" > console-health.json
          jq '{status, checkedAt, revision, checks, activity}' console-health.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: console-health
          path: console-health.json
          if-no-files-found: error
          retention-days: 14

  improvement-watchdog:
    # Do not let the slower six-hour observation job delay the watchdog past
    # its liveness budget. Watchdog runs are idempotent by GitHub run key.
    concurrency:
      group: improvement-watchdog
      cancel-in-progress: false
    if: vars.AWS_REGION != ''
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      HELM_RELEASE: ${{ vars.HELM_RELEASE || 'discord-ai-agent' }}
      K8S_NAMESPACE: ${{ vars.K8S_NAMESPACE || 'discord-ai-agent' }}
    steps:
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: actions/checkout@v7
      - name: Check improvement reconciler liveness
        run: |
          command="revision=\$(k3s kubectl --namespace '$K8S_NAMESPACE' get deployment '$HELM_RELEASE-worker' -o jsonpath='{.spec.template.spec.containers[0].env[?(@.name==\"APP_REVISION\")].value}')"
          command+="; k3s kubectl --namespace '$K8S_NAMESPACE' exec 'deployment/$HELM_RELEASE-worker' -- env GITHUB_RUN_ID='$GITHUB_RUN_ID' GITHUB_RUN_ATTEMPT='$GITHUB_RUN_ATTEMPT' node dist/scripts/improvementWatchdog.js --revision \"\$revision\" --record-detection --enforce"
          scripts/runProductionCommand.sh "$command" > improvement-watchdog.json
          jq '{revision, generatedAt, producers, detections}' improvement-watchdog.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: improvement-watchdog
          path: improvement-watchdog.json
          if-no-files-found: error
          retention-days: 14

  revision-quality:
    concurrency:
      group: production-revision-quality
      cancel-in-progress: false
    if: >-
      vars.AWS_REGION != '' &&
      (github.event_name == 'workflow_dispatch' || github.event.schedule == '17 */6 * * *')
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      HELM_RELEASE: ${{ vars.HELM_RELEASE || 'discord-ai-agent' }}
      K8S_NAMESPACE: ${{ vars.K8S_NAMESPACE || 'discord-ai-agent' }}
    steps:
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: actions/checkout@v7
      - name: Collect safe revision aggregates
        run: |
          command="revision=\$(k3s kubectl --namespace '$K8S_NAMESPACE' get deployment '$HELM_RELEASE-bot' -o jsonpath='{.spec.template.spec.containers[0].env[?(@.name==\"APP_REVISION\")].value}')"
          command+="; k3s kubectl --namespace '$K8S_NAMESPACE' exec 'deployment/$HELM_RELEASE-worker' -- node dist/scripts/revisionQuality.js --revision \"\$revision\" --hours 48 --compare --enforce --record-detection"
          scripts/runProductionCommand.sh "$command" > revision-quality.json
          jq '{revision, windowHours, generatedAt, assessment, scheduleHealth, baseline: (.baseline | if . then {revision, assessment} else null end), answers, tools, signals, deliveries, improvements, detection, verification, failureClusters}' revision-quality.json >> "$GITHUB_STEP_SUMMARY"
      - name: Collect safe improvement effectiveness
        if: always()
        run: |
          command="k3s kubectl --namespace '$K8S_NAMESPACE' exec 'deployment/$HELM_RELEASE-worker' -- node dist/scripts/improve.js --target production --confirm-production health --hours 720"
          scripts/runProductionCommand.sh "$command" > improvement-effectiveness.json
          jq '{generatedAt, window, current, flow, automation, recurrence, economics, attention}' improvement-effectiveness.json >> "$GITHUB_STEP_SUMMARY"
          if [ "$(jq -r '.attention.status' improvement-effectiveness.json)" = "needs_attention" ]; then
            echo "::warning::Improvement effectiveness crossed an attention threshold; inspect the aggregate blocker, stalled, retry-exhaustion, and recurrence counts."
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: production-revision-quality
          path: |
            revision-quality.json
            improvement-effectiveness.json
          if-no-files-found: error
          retention-days: 14
