image:
  repository: ghcr.io/owner/discord-ai-agent
  tag: latest
  pullPolicy: IfNotPresent

imagePullSecrets:
  - name: discord-ai-agent-ecr

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000

containerSecurityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]
  seccompProfile:
    type: RuntimeDefault

secret:
  existingSecretName: discord-ai-agent-env

config:
  # Deployed commit SHA included in runtime and model-call telemetry.
  appRevision: unknown
  # Unique workflow-run identifier; prevents a repeated SHA from reusing an older promotion.
  releaseVerificationId: ""

console:
  enabled: false
  replicas: 1
  port: 8081
  service:
    type: ClusterIP
  publicService:
    enabled: false
    type: LoadBalancer
    annotations: {}
    port: 443
  resources:
    requests: { cpu: 50m, memory: 96Mi }
    limits: { cpu: 250m, memory: 256Mi }

bot:
  replicas: 1
  terminationGracePeriodSeconds: 120
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: "1", memory: 1Gi }

worker:
  replicas: 1
  terminationGracePeriodSeconds: 120
  resources:
    requests: { cpu: 250m, memory: 512Mi }
    limits: { cpu: "2", memory: 2Gi }

migrations:
  enabled: true
