name: Candidate images

on:
  workflow_call:
    inputs:
      aws_region:
        required: true
        type: string
      ecr_repository:
        required: true
        type: string
    secrets:
      candidate_role_arn:
        required: true
    outputs:
      tree_tag:
        description: Git tree tag used for exact post-merge promotion.
        value: ${{ jobs.publish.outputs.tree_tag }}
      registry:
        description: ECR registry containing the candidate images.
        value: ${{ jobs.publish.outputs.registry }}

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    outputs:
      tree_tag: ${{ steps.identity.outputs.tree_tag }}
      registry: ${{ steps.ecr.outputs.registry }}
    env:
      AWS_REGION: ${{ inputs.aws_region }}
      ECR_REPOSITORY: ${{ inputs.ecr_repository }}
    steps:
      - uses: actions/checkout@v7
      - id: identity
        name: Resolve immutable source-tree identity
        run: echo "tree_tag=tree-$(git rev-parse 'HEAD^{tree}')" >>"$GITHUB_OUTPUT"
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.candidate_role_arn }}
          aws-region: ${{ env.AWS_REGION }}
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - uses: docker/setup-buildx-action@v4
      - name: Build and publish tree-addressed candidate images
        uses: docker/bake-action@v6
        with:
          push: true
          provenance: false
          files: docker-bake.hcl
          set: |
            runtime.tags=${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}-candidate:${{ steps.identity.outputs.tree_tag }}
            codegen.tags=${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}-sandbox-candidate:${{ steps.identity.outputs.tree_tag }}
            *.cache-from=type=gha,scope=runtime
