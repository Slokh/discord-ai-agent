name: Production Observation

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: production-observation
  cancel-in-progress: true

jobs:
  revision-quality:
    if: vars.AWS_REGION != '' && vars.EKS_CLUSTER_NAME != ''
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      EKS_CLUSTER_NAME: ${{ vars.EKS_CLUSTER_NAME }}
      HELM_RELEASE: ${{ vars.HELM_RELEASE || 'discord-ai-agent' }}
      K8S_NAMESPACE: ${{ vars.K8S_NAMESPACE || 'discord-ai-agent' }}
    steps:
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Collect safe revision aggregates
        run: |
          aws eks update-kubeconfig --region "$AWS_REGION" --name "$EKS_CLUSTER_NAME"
          revision="$(kubectl --namespace "$K8S_NAMESPACE" get deployment "$HELM_RELEASE-bot" -o jsonpath='{.spec.template.spec.containers[0].env[?(@.name=="APP_REVISION")].value}')"
          set +e
          kubectl --namespace "$K8S_NAMESPACE" exec "deployment/$HELM_RELEASE-worker" -- \
            node dist/scripts/revisionQuality.js --revision "$revision" --hours 48 --compare --enforce --record-detection > revision-quality.json
          quality_status="$?"
          set -e
          jq '{revision, windowHours, generatedAt, assessment, baseline: (.baseline | if . then {revision, assessment} else null end), answers, tools, signals, deliveries, improvements, detection, verification, failureClusters}' revision-quality.json >> "$GITHUB_STEP_SUMMARY"
          exit "$quality_status"
      - name: Collect safe improvement effectiveness
        if: always()
        run: |
          kubectl --namespace "$K8S_NAMESPACE" exec "deployment/$HELM_RELEASE-worker" -- \
            node dist/scripts/improve.js --target production --confirm-production health --hours 720 > improvement-effectiveness.json
          jq '{generatedAt, window, current, flow, automation, recurrence, economics, attention}' improvement-effectiveness.json >> "$GITHUB_STEP_SUMMARY"
          if [ "$(jq -r '.attention.status' improvement-effectiveness.json)" = "needs_attention" ]; then
            echo "::warning::Improvement effectiveness crossed an attention threshold; inspect the aggregate blocker, stalled, retry-exhaustion, and recurrence counts."
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: production-revision-quality
          path: |
            revision-quality.json
            improvement-effectiveness.json
          if-no-files-found: error
          retention-days: 14
