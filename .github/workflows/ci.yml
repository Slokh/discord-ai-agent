name: CI

on:
  pull_request:
  merge_group:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      container: ${{ steps.filter.outputs.container }}
      core: ${{ steps.filter.outputs.core }}
      database: ${{ steps.filter.outputs.database }}
      deployable: ${{ steps.filter.outputs.deployable }}
      documentation: ${{ steps.filter.outputs.documentation }}
      infrastructure: ${{ steps.filter.outputs.infrastructure }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: filter
        name: Classify changed files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
          PUSH_HEAD_SHA: ${{ github.sha }}
          MERGE_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          MERGE_HEAD_SHA: ${{ github.event.merge_group.head_sha }}
        run: |
          if [ -z "$BASE_SHA" ]; then
            BASE_SHA="${PUSH_BASE_SHA:-$MERGE_BASE_SHA}"
            HEAD_SHA="${PUSH_HEAD_SHA:-$MERGE_HEAD_SHA}"
          fi
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = 0000000000000000000000000000000000000000 ]; then
            BASE_SHA="$(git rev-list --max-parents=0 "$HEAD_SHA" | tail -1)"
          fi
          container=false
          core=false
          database=false
          deployable=false
          documentation=false
          infrastructure=false
          while IFS= read -r path; do
            case "$path" in
              README.md|AGENTS.md|docs/*|.github/pull_request_template.md)
                documentation=true
                ;;
            esac
            case "$path" in
              .github/workflows/*|deploy/helm/*|deploy/terraform/*)
                infrastructure=true
                ;;
            esac
            case "$path" in
              Dockerfile|.dockerignore|.grype.yaml|docker-bake.hcl|package.json|package-lock.json|native/nanocodex-runtime/Cargo.toml|native/nanocodex-runtime/Cargo.lock)
                container=true
                ;;
            esac
            case "$path" in
              .github/workflows/ci.yml|.github/workflows/deploy-eks.yml|Dockerfile|.dockerignore|docker-bake.hcl|package.json|package-lock.json|tsconfig.json|vite.console.config.ts|src/*|scripts/*|migrations/*|skills/*|native/*|deploy/helm/*)
                deployable=true
                ;;
            esac
            case "$path" in
              src/control/console/*)
                ;;
              src/*|scripts/*|migrations/*|tests/integration/*|package.json|package-lock.json)
                database=true
                ;;
            esac
            case "$path" in
              README.md|AGENTS.md|docs/*|.github/*|deploy/*)
                ;;
              *)
                core=true
                ;;
            esac
          done < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          {
            printf 'container=%s\n' "$container"
            printf 'core=%s\n' "$core"
            printf 'database=%s\n' "$database"
            printf 'deployable=%s\n' "$deployable"
            printf 'documentation=%s\n' "$documentation"
            printf 'infrastructure=%s\n' "$infrastructure"
          } >>"$GITHUB_OUTPUT"

  quality:
    needs: changes
    if: >-
      needs.changes.outputs.core == 'true' &&
      (github.event_name != 'push' || vars.CANDIDATE_IMAGE_PUBLISHING_ENABLED != 'true')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check: [lint, test, build]
    name: quality (${{ matrix.check }})
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        if: matrix.check == 'lint'
        run: npm run lint
      - name: Test with coverage
        if: matrix.check == 'test' && github.event_name == 'pull_request'
        run: npx vitest run --coverage
      - name: Check changed-file coverage
        if: matrix.check == 'test' && github.event_name == 'pull_request'
        run: npm run test:coverage:changed
      - name: Test merged revision
        if: matrix.check == 'test' && github.event_name != 'pull_request'
        run: npm test
      - name: Build production assets
        if: matrix.check == 'build'
        run: npm run build

  repository-policy:
    needs: changes
    if: always() && (github.event_name != 'push' || vars.CANDIDATE_IMAGE_PUBLISHING_ENABLED != 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check documentation
        if: needs.changes.outputs.documentation == 'true'
        run: npm run docs:check
      - name: Check generated configuration
        run: npm run config:check
      - name: Scan release contents
        run: npm run scan:release

  verify-db:
    needs: changes
    if: >-
      needs.changes.outputs.database == 'true' &&
      (github.event_name != 'push' || vars.CANDIDATE_IMAGE_PUBLISHING_ENABLED != 'true')
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: discord_ai_agent
          POSTGRES_PASSWORD: discord_ai_agent
          POSTGRES_DB: discord_ai_agent
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U discord_ai_agent -d discord_ai_agent"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run migrate
      - run: npm run test:db:coverage

  infrastructure:
    needs: changes
    if: >-
      needs.changes.outputs.infrastructure == 'true' &&
      (github.event_name != 'push' || vars.CANDIDATE_IMAGE_PUBLISHING_ENABLED != 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
      - run: helm lint deploy/helm/discord-ai-agent
      - run: helm template discord-ai-agent deploy/helm/discord-ai-agent >/tmp/discord-ai-agent.yaml
      - uses: hashicorp/setup-terraform@v4
        id: setup_terraform
        continue-on-error: true
      - uses: hashicorp/setup-terraform@v4
        if: steps.setup_terraform.outcome == 'failure'
      - run: terraform -chdir=deploy/terraform/aws fmt -check
      - run: terraform -chdir=deploy/terraform/aws init -backend=false
      - run: terraform -chdir=deploy/terraform/aws validate

  candidate-images:
    needs: [changes, quality, repository-policy, verify-db, infrastructure]
    if: >-
      always() &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      needs.changes.outputs.deployable == 'true' &&
      (needs.quality.result == 'success' || needs.quality.result == 'skipped') &&
      (needs.repository-policy.result == 'success' || needs.repository-policy.result == 'skipped') &&
      (needs.verify-db.result == 'success' || needs.verify-db.result == 'skipped') &&
      (needs.infrastructure.result == 'success' || needs.infrastructure.result == 'skipped') &&
      vars.CANDIDATE_IMAGE_PUBLISHING_ENABLED == 'true' &&
      vars.AWS_REGION != '' && vars.ECR_REPOSITORY != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      tree_tag: ${{ steps.identity.outputs.tree_tag }}
      registry: ${{ steps.ecr.outputs.registry }}
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
    steps:
      - uses: actions/checkout@v7
      - id: identity
        name: Resolve immutable source-tree identity
        run: echo "tree_tag=tree-$(git rev-parse 'HEAD^{tree}')" >>"$GITHUB_OUTPUT"
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_CANDIDATE_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - uses: docker/setup-buildx-action@v4
      - name: Build and publish tree-addressed candidate images
        uses: docker/bake-action@v7
        with:
          push: true
          provenance: false
          files: docker-bake.hcl
          set: |
            runtime.tags=${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}-candidate:${{ steps.identity.outputs.tree_tag }}
            *.cache-from=type=gha,scope=runtime

  candidate-security:
    needs: [changes, candidate-images]
    if: needs.changes.outputs.container == 'true' && needs.candidate-images.result == 'success'
    name: candidate security
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
    steps:
      - uses: actions/checkout@v7
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_CANDIDATE_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Generate runtime SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ needs.candidate-images.outputs.registry }}/${{ env.ECR_REPOSITORY }}-candidate:${{ needs.candidate-images.outputs.tree_tag }}
          format: cyclonedx-json
          output-file: sbom-runtime.cdx.json
          upload-artifact: false
      - name: Scan runtime image
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          image: ${{ needs.candidate-images.outputs.registry }}/${{ env.ECR_REPOSITORY }}-candidate:${{ needs.candidate-images.outputs.tree_tag }}
          config: .grype.yaml
          fail-build: true
          severity-cutoff: critical
          only-fixed: true
          output-file: grype-runtime.sarif
      - name: Upload candidate security evidence
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: candidate-security
          path: |
            sbom-*.cdx.json
            grype-*.sarif
          if-no-files-found: warn

  container-security:
    needs: [changes, quality, repository-policy, verify-db, infrastructure, candidate-images]
    if: >-
      always() &&
      github.event_name == 'pull_request' &&
      needs.changes.outputs.container == 'true' &&
      needs.candidate-images.result != 'success' &&
      (needs.quality.result == 'success' || needs.quality.result == 'skipped') &&
      (needs.repository-policy.result == 'success' || needs.repository-policy.result == 'skipped') &&
      (needs.verify-db.result == 'success' || needs.verify-db.result == 'skipped') &&
      (needs.infrastructure.result == 'success' || needs.infrastructure.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build runtime image
        uses: docker/bake-action@v7
        with:
          load: true
          files: docker-bake.hcl
          set: |
            *.cache-from=type=gha,scope=runtime
      - name: Generate runtime SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: discord-ai-agent:ci-runtime
          format: cyclonedx-json
          output-file: sbom-runtime.cdx.json
          upload-artifact: false
      - name: Scan runtime image
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          image: discord-ai-agent:ci-runtime
          config: .grype.yaml
          fail-build: true
          severity-cutoff: critical
          only-fixed: true
          output-file: grype-runtime.sarif
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: container-security-fallback
          path: |
            sbom-*.cdx.json
            grype-*.sarif
          if-no-files-found: warn

  verify:
    name: verify
    needs:
      - changes
      - quality
      - repository-policy
      - verify-db
      - infrastructure
      - candidate-images
      - candidate-security
      - container-security
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require successful checks
        env:
          RESULTS: >-
            ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            case "$result" in
              success|skipped) ;;
              *)
                printf 'A required CI job finished with %s\n' "$result"
                exit 1
                ;;
            esac
          done

  publish-images:
    needs: changes
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.deployable == 'true' && vars.AWS_REGION != '' && vars.ECR_REPOSITORY != ''
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
      - id: identity
        name: Resolve immutable source-tree identity
        run: echo "tree_tag=tree-$(git rev-parse 'HEAD^{tree}')" >>"$GITHUB_OUTPUT"
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_CANDIDATE_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - uses: docker/setup-buildx-action@v4
      - id: promote
        name: Promote the verified candidate images
        if: vars.CANDIDATE_IMAGE_PUBLISHING_ENABLED == 'true'
        continue-on-error: true
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          TREE_TAG: ${{ steps.identity.outputs.tree_tag }}
        run: |
          docker buildx imagetools create \
            --tag "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" \
            "$REGISTRY/$ECR_REPOSITORY-candidate:$TREE_TAG"
          aws ecr batch-delete-image \
            --repository-name "$ECR_REPOSITORY-candidate" \
            --image-ids "imageTag=$TREE_TAG" >/dev/null || true
      - name: Require the exact verified candidate
        if: vars.CANDIDATE_IMAGE_PUBLISHING_ENABLED == 'true' && steps.promote.outcome != 'success'
        run: |
          echo "No candidate images matched the merged Git tree; refusing an unverified production rebuild."
          exit 1
      - name: Build and publish images when no verified candidate exists
        if: vars.CANDIDATE_IMAGE_PUBLISHING_ENABLED != 'true'
        uses: docker/bake-action@v7
        with:
          push: true
          provenance: false
          files: docker-bake.hcl
          set: |
            runtime.tags=${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}
            *.cache-from=type=gha,scope=runtime
            runtime.cache-to=type=gha,mode=max,scope=runtime,ignore-error=true

  deploy-eks:
    needs: [changes, verify, publish-images]
    if: >-
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.changes.outputs.deployable == 'true' &&
      needs.verify.result == 'success' &&
      needs.publish-images.result == 'success' &&
      vars.AWS_REGION != '' &&
      vars.EKS_CLUSTER_NAME != '' &&
      vars.ECR_REPOSITORY != '' &&
      vars.STANDALONE_DEPLOYMENT_ENABLED == 'true'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy-eks.yml
    with:
      image_tag: ${{ github.sha }}
    secrets: inherit
